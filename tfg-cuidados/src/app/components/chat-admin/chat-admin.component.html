@if (currentUser?.rol !== 'administrador') {
  <div class="fixed bottom-4 right-4 md:bottom-24 md:right-12 z-50 flex flex-col items-end gap-4">
    @if (isOpen) {
      <div
        class="w-[calc(100vw-2rem)] md:w-88 h-[450px] md:h-96 bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden animate-fade-in-up"
      >
        <div class="bg-primary text-white p-4 flex justify-between items-center shadow-md shrink-0">
          <div class="flex items-center gap-2">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="20"
              height="20"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"
              ></path>
            </svg>
            <h3 class="font-bold text-sm">{{ 'SUPPORT_WIDGET.HEADER_TITLE' | translate }}</h3>
          </div>
          <button
            (click)="toggleChat()"
            class="p-1 hover:bg-white/20 rounded-full transition-colors"
          >
            <svg
              xmlns="http://www.w3.org/2000/svg"
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="p-5 md:p-6 flex flex-col gap-4 bg-slate-50 overflow-y-auto flex-1">
          <div class="text-center">
            <h4 class="text-sm font-bold text-gray-800">
              {{ 'SUPPORT_WIDGET.HELP_TITLE' | translate }}
            </h4>
            <p class="text-xs text-gray-500 mt-1 leading-relaxed">
              {{ 'SUPPORT_WIDGET.HELP_DESCRIPTION' | translate }}
            </p>
          </div>

          <div class="flex flex-col gap-2">
            <label
              class="text-[10px] font-bold text-gray-400 uppercase tracking-widest text-center"
            >
              {{ 'SUPPORT_WIDGET.MESSAGE_LABEL' | translate }}
            </label>
            <textarea
              [(ngModel)]="newMessage"
              rows="4"
              [placeholder]="'SUPPORT_WIDGET.MESSAGE_PLACEHOLDER' | translate"
              class="w-full border border-gray-300 rounded-xl p-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 resize-none shadow-inner bg-white"
            ></textarea>
          </div>

          @if (messageSent) {
            <div
              class="bg-green-100 border border-green-200 text-green-700 text-xs p-3 rounded-lg flex items-center justify-center gap-2 animate-fade-in-up"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="16"
                height="16"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="20 6 9 17 4 12"></polyline>
              </svg>
              {{ 'SUPPORT_WIDGET.SUCCESS_MESSAGE' | translate }}
            </div>
          }
        </div>

        <div class="p-4 bg-white border-t border-gray-100 shrink-0">
          <button
            (click)="sendMessage()"
            [disabled]="!newMessage.trim() || isSending"
            class="w-full bg-primary text-white rounded-xl py-3 font-bold hover:opacity-90 active:scale-95 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2 shadow-md"
          >
            @if (isSending) {
              <div
                class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"
              ></div>
              {{ 'SUPPORT_WIDGET.SENDING_BTN' | translate }}
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
              </svg>
              {{ 'SUPPORT_WIDGET.SEND_BTN' | translate }}
            }
          </button>
        </div>
      </div>
    }

    <button
      (click)="toggleChat()"
      class="w-14 h-14 bg-accent rounded-full shadow-lg flex items-center justify-center text-white hover:bg-opacity-90 hover:scale-110 active:scale-90 transition-all duration-200 z-50"
    >
      @if (!isOpen) {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="28"
          height="28"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M3 18v-6a9 9 0 0 1 18 0v6"></path>
          <path
            d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"
          ></path>
        </svg>
      } @else {
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      }
    </button>
  </div>
}
