<section class="ia-container" [attr.aria-label]="'AI_ASSISTANT.HEADER_TITLE' | translate">
  @if (isOpen) {
    <div
      id="ia-chat-window"
      class="ia-container-open animate-fade-in-up"
      role="dialog"
      aria-labelledby="ia-header-title"
    >
      <header class="ia-icon">
        <div class="flex items-center gap-3">
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
          <h3 id="ia-header-title" class="font-bold text-sm">
            {{ 'AI_ASSISTANT.HEADER_TITLE' | translate }}
          </h3>
        </div>

        <button
          (click)="toggleChat()"
          class="ia-btn-toggle"
          [attr.aria-label]="'AI_ASSISTANT.CLOSE_CHAT' | translate"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </header>

      <main class="ia-messages-container" role="log" aria-live="polite">
        @for (msg of messages; track $index) {
          <div class="flex w-full" [ngClass]="msg.isUser ? 'justify-end' : 'justify-start'">
            <div
              class="max-w-[85%] rounded-2xl px-4 py-2 text-sm shadow-sm"
              [ngClass]="
                msg.isUser
                  ? 'bg-primary text-white rounded-br-sm'
                  : 'bg-white border border-gray-200 text-gray-800 rounded-bl-sm'
              "
            >
              <span class="sr-only">
                {{ (msg.isUser ? 'AI_ASSISTANT.YOU' : 'AI_ASSISTANT.ASSISTANT') | translate }}:
              </span>
              <p
                class="whitespace-pre-wrap leading-relaxed text-sm md:text-base"
                [innerHTML]="msg.text"
              ></p>
            </div>
          </div>
        }

        @if (isLoading) {
          <div class="ia-loading-container animate-fade-in-up" aria-busy="true">
            <div
              class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1.5"
            >
              <span class="sr-only">{{ 'AI_ASSISTANT.THINKING' | translate }}</span>
              <div
                class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
                aria-hidden="true"
              ></div>
              <div
                class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
                style="animation-delay: 0.15s"
                aria-hidden="true"
              ></div>
              <div
                class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
                style="animation-delay: 0.3s"
                aria-hidden="true"
              ></div>
            </div>
          </div>
        }
      </main>

      <footer class="ia-new-message-container">
        <input
          type="text"
          [(ngModel)]="newMessage"
          (keyup.enter)="sendMessage()"
          [disabled]="isLoading"
          [placeholder]="'AI_ASSISTANT.INPUT_PLACEHOLDER' | translate"
          [attr.aria-label]="'AI_ASSISTANT.INPUT_LABEL' | translate"
          class="ia-input"
        />
        <button
          (click)="sendMessage()"
          [disabled]="!newMessage.trim() || isLoading"
          class="ia-btn"
          [attr.aria-label]="'AI_ASSISTANT.SEND_MESSAGE' | translate"
        >
          <svg
            aria-hidden="true"
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </footer>
    </div>
  }

  <button
    (click)="toggleChat()"
    class="w-14 h-14 bg-accent rounded-full shadow-lg flex items-center justify-center text-white hover:bg-secondary hover:scale-110 active:scale-90 transition-all duration-300 z-50"
    [attr.aria-expanded]="isOpen"
    aria-controls="ia-chat-window"
    [attr.aria-label]="(isOpen ? 'AI_ASSISTANT.CLOSE_CHAT' : 'AI_ASSISTANT.OPEN_CHAT') | translate"
  >
    @if (!isOpen) {
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8.01" y2="16"></line>
        <line x1="16" y1="16" x2="16.01" y2="16"></line>
      </svg>
    } @else {
      <svg
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    }
  </button>
</section>
