<div class="fixed bottom-4 right-4 md:bottom-24 md:right-12 z-50 flex flex-col items-end gap-4">
  @if (isOpen) {
    <div
      class="w-[calc(100vw-2rem)] md:w-88 h-[500px] md:h-[450px] bg-white rounded-2xl shadow-2xl border border-gray-200 flex flex-col overflow-hidden animate-fade-in-up"
    >
      <div class="bg-primary text-white p-4 flex justify-between items-center shadow-md shrink-0">
        <div class="flex items-center gap-3">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="22"
            height="22"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect x="3" y="11" width="18" height="10" rx="2"></rect>
            <circle cx="12" cy="5" r="2"></circle>
            <path d="M12 7v4"></path>
            <line x1="8" y1="16" x2="8.01" y2="16"></line>
            <line x1="16" y1="16" x2="16.01" y2="16"></line>
          </svg>
          <h3 class="font-bold text-sm">{{ 'AI_ASSISTANT.HEADER_TITLE' | translate }}</h3>
        </div>
        <button (click)="toggleChat()" class="p-1 hover:bg-white/20 rounded-full transition-colors">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <div class="flex-1 p-4 bg-slate-50 overflow-y-auto flex flex-col gap-3">
        @for (msg of messages; track $index) {
          <div class="flex w-full" [ngClass]="msg.isUser ? 'justify-end' : 'justify-start'">
            <div
              class="max-w-[85%] rounded-2xl px-4 py-2 text-sm shadow-sm"
              [ngClass]="
                msg.isUser
                  ? 'bg-primary text-white rounded-br-sm'
                  : 'bg-white border border-gray-200 text-gray-800 rounded-bl-sm'
              "
            >
              <p class="whitespace-pre-wrap leading-relaxed text-sm md:text-base">{{ msg.text }}</p>
            </div>
          </div>
        }

        @if (isLoading) {
          <div class="flex w-full justify-start animate-fade-in-up">
            <div
              class="bg-white border border-gray-200 rounded-2xl rounded-bl-sm px-4 py-3 shadow-sm flex items-center gap-1.5"
            >
              <div class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"></div>
              <div
                class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
                style="animation-delay: 0.15s"
              ></div>
              <div
                class="w-1.5 h-1.5 bg-gray-400 rounded-full animate-bounce"
                style="animation-delay: 0.3s"
              ></div>
            </div>
          </div>
        }
      </div>

      <div class="p-3 bg-white border-t border-gray-100 flex gap-2 items-center shrink-0">
        <input
          type="text"
          [(ngModel)]="newMessage"
          (keyup.enter)="sendMessage()"
          [disabled]="isLoading"
          [placeholder]="'AI_ASSISTANT.INPUT_PLACEHOLDER' | translate"
          class="flex-1 border border-gray-300 rounded-full px-4 py-3 text-sm focus:outline-none focus:border-primary focus:ring-2 focus:ring-primary/20 transition-all disabled:bg-gray-50"
        />
        <button
          (click)="sendMessage()"
          [disabled]="!newMessage.trim() || isLoading"
          class="bg-accent text-white rounded-full w-12 h-12 flex items-center justify-center hover:opacity-90 active:scale-90 transition-all disabled:opacity-50 shadow-sm"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="20"
            height="20"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </div>
  }

  <button
    (click)="toggleChat()"
    class="w-14 h-14 bg-accent rounded-full shadow-lg flex items-center justify-center text-white hover:bg-secondary hover:scale-110 active:scale-90 transition-all duration-300 z-50"
  >
    @if (!isOpen) {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
        <circle cx="12" cy="5" r="2"></circle>
        <path d="M12 7v4"></path>
        <line x1="8" y1="16" x2="8.01" y2="16"></line>
        <line x1="16" y1="16" x2="16.01" y2="16"></line>
      </svg>
    } @else {
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    }
  </button>
</div>
