<div
  class="w-full overflow-hidden rounded-lg border border-gray-200 bg-white shadow-sm dark:border-gray-700 dark:bg-gray-800"
>
  <div
    class="flex border-b border-gray-300 bg-gray-50 dark:border-surface px-6 py-3 dark:bg-gray-700"
  >
    <div class="h-4 w-24 rounded bg-gray-300 dark:bg-gray-600"></div>
    <div class="ml-auto h-4 w-40 rounded bg-gray-300 dark:bg-gray-600"></div>
    <div class="ml-auto h-4 w-20 rounded bg-gray-50 dark:bg-gray-50"></div>
  </div>

  <div class="divide-y divide-gray-200 dark:divide-gray-700">
    @for (i of [1, 2, 3, 4, 5]; track i) {
      <div class="flex animate-pulse items-center px-6 py-4 gap-4">
        <div class="w-1/4">
          <div class="h-5 w-3/4 rounded bg-gray-200 dark:bg-gray-700"></div>
        </div>

        <div class="w-2/4">
          <div class="space-y-2">
            <div class="h-3 w-full rounded bg-gray-100 dark:bg-gray-700/50"></div>
            <div class="h-3 w-5/6 rounded bg-gray-100 dark:bg-gray-700/50"></div>
          </div>
        </div>

        <div class="ml-auto flex w-1/4 justify-end gap-3">
          <div class="h-9 w-9 rounded-sm bg-primary dark:bg-surface"></div>
          <div class="h-9 w-9 rounded-sm bg-red-100/50 dark:bg-red-900/20"></div>
        </div>
      </div>
    }
  </div>
</div>
