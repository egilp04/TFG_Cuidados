<div 
  class="avatar-container"
  [style.background-color]="imageUrl() ? 'transparent' : backgroundHsl()"
>
  
  @if (imageUrl()) {
    <img 
      [src]="imageUrl()" 
      [alt]="'Avatar of ' + name()" 
      class="avatar-img" 
      loading="lazy" 
    />
  } 
  
  @else {
    <span class="avatar-text">
      {{ initials() }}
    </span>
  }
</div>
