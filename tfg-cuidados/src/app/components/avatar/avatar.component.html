<div [style.background-color]="backgroundColor" 
     class="w-full h-full rounded-full flex items-center justify-center overflow-hidden border-2 border-white shadow-sm">
  
  @if (imageUrl) {
    <img [src]="imageUrl" class="w-full h-full object-cover" alt="Avatar">
  } @else {
    <span class="avatar-text">
      {{ initials }}
    </span>
  }
</div>
