@if (messageService.messageData(); as data) {
  <section class="message-noti" role="status" aria-live="polite">
    <div
      [ngClass]="{
        'text-red-500': data.type === 'error',
        'text-primary': data.type === 'success',
      }"
      class="message-noti-text"
    >
      <span class="sr-only">
        {{ (data.type === 'error' ? 'COMMON.ERROR' : 'COMMON.SUCCESS') | translate }}:
      </span>
      {{ data.mensaje }}
    </div>
  </section>
}
