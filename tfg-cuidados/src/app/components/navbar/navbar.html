<nav class="nav-container">
  <div class="flex items-center">
    <a (click)="backHome()" class="cursor-pointer">
      <picture>
        <source srcset="assets/img/logo/logo.webp" media="(min-width: 1024px)" />
        <source srcset="assets/img/logo/logo.webp" media="(min-width: 768px)" />
        <img src="assets/img/logo/logo_peque.webp" alt="CuidaDos" class="h-20 lg:h-22" />
      </picture>
    </a>
  </div>

  <div class="flex md:hidden">
    <button (click)="toggleMenu()" class="nav-menu-icon">
      <lucide-icon name="menu" class="w-4 h-20"></lucide-icon>
    </button>
  </div>

  <div class="nav-menu-unified" [ngClass]="{'hidden md:flex': !isMenuOpen, 'flex': isMenuOpen}">
    @if (authService.isAuthenticated()) {
      <div class="nav-authenticated-wrapper">
        <div class="nav-icon-container" (click)="showComunications('mensajes')">
          <lucide-icon name="mail" class="nav-icon-style"></lucide-icon>
          @if (countMensajes$ | async; as countMensajes) {
            <span class="nav-badge">{{ countMensajes }}</span>
          }
          <span class="sr-only">Mensajes</span>
        </div>

        <div class="nav-icon-container" (click)="showComunications('notificaciones')">
          <lucide-icon name="bell" class="nav-icon-style"></lucide-icon>
          @if (countNotificaciones$ | async; as countNotis) {
            <span class="nav-badge">{{ countNotis }}</span>
          }
          <span class="sr-only">Notificaciones</span>
        </div>

        <div class="nav-icon-container" (click)="modifyProfileFunction()">
          <lucide-icon name="user" class="nav-icon-style"></lucide-icon>
          <span class="sr-only">Perfil</span>
        </div>

        <app-button
          [label]="'NAVBAR.LOGOUT' | translate"
          variant="primary"
          size="lg"
          class="w-full md:w-auto mt-4 md:mt-0"
          (onClick)="logout()"
        ></app-button>
        
      </div>
    } @else {
      <div class="nav-guest-wrapper">
        <app-button
          [label]="'NAVBAR.REGISTER' | translate"
          variant="secondary"
          class="w-full md:w-auto"
          (onClick)="registerFunction()"
        ></app-button>
        <app-button
          [label]="'NAVBAR.LOGIN' | translate"
          variant="primary"
          class="w-full md:w-auto mt-2 md:mt-0"
          (onClick)="startSession()"
        ></app-button>
      </div>
    }
    
    <app-dark-mode-btn class="mt-4 md:mt-0"></app-dark-mode-btn>
  </div>
</nav>
