<footer
  class="footer-container"
  role="contentinfo"
  [attr.aria-label]="'FOOTER.ACCESSIBILITY.FOOTER_SECTION' | translate"
>
  <nav [attr.aria-label]="'FOOTER.ACCESSIBILITY.NAV_LABEL' | translate" class="footer-nav">
    <a routerLink="/terms" class="footer-text animate-text-up">
      {{ 'FOOTER.LEGAL_ASPECTS' | translate }}
    </a>
    <a routerLink="/terms" class="footer-text animate-text-up delay-150">
      {{ 'FOOTER.PRIVACY_POLICTICS' | translate }}
    </a>
    <a routerLink="/cookies_politics" class="footer-text animate-text-up delay-300">
      {{ 'FOOTER.COOKIES_POLICIES' | translate }}
    </a>
    <div class="flex flex-col gap-1">
      <label class="text-label text-surface dark:text-accent">{{
        'FOOTER.FOLLOW' | translate
      }}</label>
      <div class="flex flex-row gap-2 justify-between">
        <a
          href="https://github.com/egilp04/TFG_Cuidados"
          target="_blank"
          class="text-surface dark:text-accent hover:text-accent transition-colors duration-300 transform hover:scale-110"
          [attr.aria-label]="'GitHub'"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            ></path>
            <path d="M9 18c-4.51 2-5-2-7-2"></path>
          </svg>
        </a>
        <a
          href="https://www.linkedin.com/in/evelia-gil-paredes/"
          target="_blank"
          class="text-surface dark:text-accent hover:text-accent transition-colors duration-300 transform hover:scale-110"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path
              d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"
            ></path>
            <rect width="4" height="12" x="2" y="9"></rect>
            <circle cx="4" cy="4" r="2"></circle>
          </svg>
        </a>
        <a
          href="https://instagram.com"
          target="_blank"
          class="text-surface dark:text-accent hover:text-accent transition-colors duration-300 transform hover:scale-110"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
            <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
          </svg>
        </a>
      </div>
    </div>
  </nav>
</footer>
