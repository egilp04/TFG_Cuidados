<nav class="secondary-navbar" [attr.aria-label]="'MAIN_MENU.TITLE' | translate">
  <h1 class="sr-only">
    {{ 'MAIN_MENU.TITLE' | translate }}
  </h1>

  <div class="secondary-nav-container" role="menubar">
    @if (rol === 'client') {
      <app-button
        [label]="'MAIN_MENU.CLIENT.SEARCH_COMPANIES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="searchForBussiness()"
      >
      </app-button>
    } @else if (rol === 'business') {
      <app-button
        [label]="'MAIN_MENU.BUSINESS.MANAGE_SERVICES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="manageServices()"
      >
      </app-button>
    } @else if (rol === 'administrator') {
      <app-button
        [label]="'MAIN_MENU.ADMIN.DASHBOARD' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="checkDashboard()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.ADMIN.MANAGE_USERS' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="manageUsers()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.ADMIN.MANAGE_COMPANIES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="manageBussinesses()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.ADMIN.MANAGE_SERVICES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="manageGlobalServices()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.ADMIN.MANAGE_SCHEDULES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="manageGlobalTimes()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.CLIENT.MY_SERVICES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="seeAllContracts()"
      >
      </app-button>
    }

    @if (rol != 'administrator') {
      <app-button
        [label]="'MAIN_MENU.CLIENT.MY_SERVICES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="checkContracts()"
      >
      </app-button>
      <app-button
        [label]="'MAIN_MENU.COMMON.ACTIVITIES' | translate"
        variant="primary"
        class="nav-btn animation-opacity"
        (click)="programedActivities()"
      >
      </app-button>
    }
  </div>
</nav>
