<div class="dropdown-container">
  <div class="dropdown-inner-container" (click)="toggleDropdown()">
    <span class="dropdown-title">
      {{ selectedOption || label | translate }}
    </span>
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
      class="dropdown-icon"
      [class.rotate-180]="isOpen"
    >
      <path d="m6 9 6 6 6-6" />
    </svg>
  </div>

  @if (isOpen) {
    <div class="dropdown-open-container options-list">
      @for (option of options; track option) {
        <div class="option-item dropdown-options" (click)="selectOption(option)">
          {{ option | translate }}
        </div>
      }
    </div>
  }
</div>
