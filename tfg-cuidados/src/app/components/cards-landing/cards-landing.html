<section class="animate-cards cards-landing-container">
  <header class="cards-landing-img-container">
    <img [src]="imagen()" [alt]="titulo() | translate" class="cards-landing-img" />
  </header>
  <main [class]="cardClasses()">
    <h2 class="cards-landing-title">{{ titulo() | translate }}</h2>
    @if (cargo()) {
      <label class="cards-landing-cargo">
        {{ cargo() | translate }}
      </label>
    }
    <p class="cards-landing-description">{{ descripcion() | translate }}</p>
  </main>
</section>
