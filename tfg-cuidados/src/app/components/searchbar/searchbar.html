<section class="search-bar-container group">
  <div class="search-icon">
    <lucide-icon [name]="'search'" class="search-icon"></lucide-icon>
  </div>
  <input
    type="text"
    [formControl]="control"
    (input)="onInput($event)"
    placeholder="{{ 'SEARCH_PLACEHOLDER' | translate }}"
    class="search-input text-label"
  />
</section>
