<section class="message-modal-container">
  <header class="w-full flex justify-end p-10">
    <svg
      mat-dialog-close
      xmlns="http://www.w3.org/2000/svg"
      class="modal-close-btn"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="4"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <line x1="18" y1="6" x2="6" y2="18"></line>
      <line x1="6" y1="6" x2="18" y2="18"></line>
    </svg>
  </header>

  @if (this.messageService.messageData(); as data) {
    <div
      [ngClass]="{
        'text-red-500': data.tipo === 'error',
        'text-primary': data.tipo === 'exito',
      }"
      class="message-noti-text"
    >
      {{ data.mensaje }}
    </div>
  }

  <main class="message-modal-form-container">
    @if (data.modo == 'escribir') {
      <app-inputs
        name="receptor"
        [label]="'MESSAGES_MODAL.LABELS.TO' | translate"
        [control]="getCtrl('receptor')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="asunto"
        [label]="'MESSAGES_MODAL.LABELS.SUBJECT' | translate"
        [control]="getCtrl('asunto')"
        type="text"
      >
      </app-inputs>
    } @else {
      <app-inputs
        name="emisor"
        [label]="'MESSAGES_MODAL.LABELS.SENDER' | translate"
        [control]="getCtrl('emisor')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="receptor"
        [label]="'MESSAGES_MODAL.LABELS.RECEIVER' | translate"
        [control]="getCtrl('receptor')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="asunto"
        [label]="'MESSAGES_MODAL.LABELS.SUBJECT' | translate"
        [control]="getCtrl('asunto')"
        type="text"
      >
      </app-inputs>
    }

    <div class="message-modal-text-container">
      <label class="message-modal-label">
        {{ 'MESSAGES_MODAL.LABELS.MESSAGE_CONTENT' | translate }}
      </label>
      <textarea
        [formControl]="getCtrl('contenido')"
        class="message-modal-textarea"
        [placeholder]="'MESSAGES_MODAL.PLACEHOLDERS.WRITE_HERE' | translate"
      >
      </textarea>
    </div>

    @if (data.modo == 'escribir') {
      <div class="flex justify-center mt-4">
        <app-button
          [label]="'MESSAGES_MODAL.BTN.SEND' | translate"
          variant="primary"
          size="lg"
          [disabled]="this.mensajeForm.invalid"
          (onClick)="sendMessage()"
        >
        </app-button>
      </div>
    }
  </main>
</section>
