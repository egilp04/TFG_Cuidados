<section
  class="message-modal-container"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="
    (data.mode === 'escribir' ? 'MESSAGES_MODAL.TITLE_WRITE' : 'MESSAGES_MODAL.TITLE_VIEW')
      | translate
  "
>
  <header class="header-modal">
    <button
      mat-dialog-close
      [attr.aria-label]="'MESSAGES_MODAL.ACCESSIBILITY.CLOSE' | translate"
      class="modal-close-btn"
    >
      <app-close-btn></app-close-btn>
    </button>
  </header>

  <main class="message-modal-form-container">
    @if (data.mode == 'escribir') {
      <app-inputs
        name="receiver"
        [label]="'MESSAGES_MODAL.LABELS.TO' | translate"
        [control]="getCtrl('receiver')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="topic"
        [label]="'MESSAGES_MODAL.LABELS.topic' | translate"
        [control]="getCtrl('topic')"
        type="text"
      >
      </app-inputs>
    } @else {
      <app-inputs
        name="sender"
        [label]="'MESSAGES_MODAL.LABELS.SENDER' | translate"
        [control]="getCtrl('sender')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="receiver"
        [label]="'MESSAGES_MODAL.LABELS.RECEIVER' | translate"
        [control]="getCtrl('receiver')"
        type="text"
      >
      </app-inputs>
      <app-inputs
        name="topic"
        [label]="'MESSAGES_MODAL.LABELS.topic' | translate"
        [control]="getCtrl('topic')"
        type="text"
      >
      </app-inputs>
    }

    <div class="message-modal-text-container">
      <label class="message-modal-label" for="message-content">
        {{ 'MESSAGES_MODAL.LABELS.MESSAGE_CONTENT' | translate }}
      </label>
      <textarea
        id="message-content"
        [formControl]="getCtrl('content')"
        class="message-modal-textarea"
        [placeholder]="'MESSAGES_MODAL.PLACEHOLDERS.WRITE_HERE' | translate"
        [attr.aria-required]="true"
      >
      </textarea>
    </div>

    @if (data.mode == 'escribir') {
      <div class="flex justify-center mt-4">
        <app-button
          [label]="'MESSAGES_MODAL.BTN.SEND' | translate"
          variant="primary"
          size="lg"
          [disabled]="this.messageForm.invalid"
          (onClick)="sendMessage()"
          [attr.aria-label]="'MESSAGES_MODAL.ACCESSIBILITY.SEND_DESC' | translate"
        >
        </app-button>
      </div>
    }
  </main>
</section>
