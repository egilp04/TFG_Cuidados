<button 
  (click)="goBack()" 
  class="button-back flex items-center gap-2"
  [attr.aria-label]="'BUTTONBACK.BTN_BACK' | translate"
>
  <svg
    xmlns="http://www.w3.org/2000/svg"
    fill="none"
    viewBox="0 0 24 24"
    stroke-width="2"
    stroke="currentColor"
    class="w-3 h-3 md:w-4 md:h-4 xl:w-5 xl:h-5 2xl:w-[30px] 2xl:h-[30px]"
    aria-hidden="true"
  >
    <path 
      stroke-linecap="round" 
      stroke-linejoin="round" 
      d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" 
    />
  </svg>
  <span class="button-back-text text-label">
    {{ 'BUTTONBACK.BTN_BACK' | translate }}
  </span>
</button>
