<header
  class="button-back-container"
  [attr.aria-label]="'CONTRACTS.ACCESSIBILITY.BACK_NAV' | translate"
>
  <app-buttonback></app-buttonback>
</header>

<section class="contracts-container-section" role="main" aria-labelledby="contracts-page-title">
  <h1 id="contracts-page-title" class="contracts-title">
    {{ 'CONTRACTS.TITLE' | translate }}
  </h1>
  <div class="contracts-table-container">
    <main class="contracts-table">
      <table
        mat-table
        [dataSource]="dataSource"
        class="mat-elevation-z8 w-full"
        [attr.aria-label]="'CONTRACTS.TABLE_SUMMARY' | translate"
      >
        <ng-container matColumnDef="ID">
          <th mat-header-cell *matHeaderCellDef class="text-label contracts-text" scope="col">
            {{ 'CONTRACTS.TABLE.ID' | translate }}
          </th>
          <td mat-cell *matCellDef="let contrato" class="text-label contracts-text">
            {{ contrato.id_contrato }}
          </td>
        </ng-container>

        <ng-container matColumnDef="fecha">
          <th mat-header-cell *matHeaderCellDef class="text-label contracts-text" scope="col">
            {{ 'CONTRACTS.TABLE.DATE' | translate }}
          </th>
          <td mat-cell *matCellDef="let contrato" class="text-label contracts-text">
            {{ contrato.fecha_creacion | date: 'dd/MM/yyyy' }}
          </td>
        </ng-container>

        <ng-container matColumnDef="acciones">
          <th mat-header-cell *matHeaderCellDef class="text-center" scope="col">
            <span class="sr-only">{{ 'CONTRACTS.TABLE.ACTIONS' | translate }}</span>
          </th>
          <td mat-cell *matCellDef="let contrato" class="text-center">
            <div class="flex justify-end gap-2 p-2">
              <app-button
                [label]="'CONTRACTS.ACTIONS.CANCEL' | translate"
                variant="secondary"
                (click)="cancelContract(contrato.id_contrato)"
                [attr.aria-label]="
                  ('CONTRACTS.ACTIONS.CANCEL' | translate) + ' ID: ' + contrato.id_contrato
                "
              ></app-button>

              <app-button
                [label]="'CONTRACTS.ACTIONS.DETAILS' | translate"
                variant="primary"
                (click)="showDetails(contrato.id_contrato)"
                [attr.aria-label]="
                  ('CONTRACTS.ACTIONS.DETAILS' | translate) + ' ID: ' + contrato.id_contrato
                "
              ></app-button>
            </div>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </main>

    <mat-paginator
      class="mt-20"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
      [attr.aria-label]="'CONTRACTS.PAGINATOR' | translate"
    ></mat-paginator>
  </div>
</section>
