<div class="w-full mb-4">
  <app-buttonback></app-buttonback>
</div>

<div class="message-noti">
  <h1 class="contracts-title">
    {{ 'CONTRACTS.TITLE' | translate }}
  </h1>

  @if (this.messageService.messageData(); as data) {
    <div
      [ngClass]="{
        'text-red-500': data.tipo === 'error',
        'text-primary': data.tipo === 'exito',
      }"
      class="message-noti-text"
    >
      {{ data.mensaje }}
    </div>
  }

  <div class="contracts-table-container">
    <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 w-full">
      <ng-container matColumnDef="ID">
        <th mat-header-cell *matHeaderCellDef class="text-label contracts-text">
          {{ 'CONTRACTS.TABLE.ID' | translate }}
        </th>
        <td mat-cell *matCellDef="let contrato" class="text-label contracts-text">
          {{ contrato.id_contrato }}
        </td>
      </ng-container>

      <ng-container matColumnDef="fecha">
        <th mat-header-cell *matHeaderCellDef class="text-label contracts-text">
          {{ 'CONTRACTS.TABLE.DATE' | translate }}
        </th>
        <td mat-cell *matCellDef="let contrato" class="text-label contracts-text">
          {{ contrato.fecha_creacion | date: 'dd/MM/yyyy' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="acciones">
        <th mat-header-cell *matHeaderCellDef class="text-center"></th>
        <td mat-cell *matCellDef="let contrato" class="text-center">
          <app-button
            [label]="'CONTRACTS.ACTIONS.CANCEL' | translate"
            variant="secondary"
            (click)="cancelarContrato(contrato.id_contrato)"
          ></app-button>

          <app-button
            [label]="'CONTRACTS.ACTIONS.DETAILS' | translate"
            variant="primary"
            (click)="verDetalles(contrato.id_contrato)"
          ></app-button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    <mat-paginator
      class="mt-20"
      [pageSizeOptions]="[5, 10, 20]"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
