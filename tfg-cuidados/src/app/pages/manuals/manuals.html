<header class="w-full mb-4" [attr.aria-label]="'MANUALS.ACCESSIBILITY.BACK_NAV' | translate">
  <app-buttonback></app-buttonback>
</header>

<main class="manuals-container" role="main" aria-labelledby="manuals-main-title">
  <h1 id="manuals-main-title" class="manuals-title">{{ 'MANUALS.TITLE' | translate }}</h1>

  <section
    class="manuals-download-container"
    role="list"
    [attr.aria-label]="'MANUALS.ACCESSIBILITY.LIST_LABEL' | translate"
  >
    @for (item of cardsdata; track item.title; let i = $index) {
      <div class="manuals-cards-container" role="listitem">
        <app-cards-landing
          class="w-full h-full"
          [title]="item.title"
          [charge]="item.charge"
          [description]="item.description"
          [image]="item.image"
        >
        </app-cards-landing>

        <a
          [href]="item.data"
          [download]="item.data"
          target="_blank"
          class="manuals-link"
          [attr.aria-label]="'Descargar PDF: ' + item.title + ' (se abrirá en una pestaña nueva)'"
        >
          <app-button label="Descargar PDF" variant="primary" class="" tabindex="-1"></app-button>
        </a>
      </div>
    }
  </section>

  <section class="manual-video-container" aria-labelledby="manuals-video-title">
    <h2 id="manuals-video-title" class="manuals-title">
      {{ 'MANUALS.USERVIDEO' | translate }}
    </h2>

    <a
      class="button-base manual-video-btn animate-shadow-pulse"
      href="https://youtu.be/okBBfYk9x3I?si=TXp7t2F1XyDVUOtA"
      target="_blank"
      [attr.aria-label]="
        ('MANUALS.USERVIDEO' | translate) + ' (abre un vídeo de YouTube en una pestaña nueva)'
      "
    >
      {{ 'MANUALS.USERVIDEO' | translate }}
    </a>
  </section>
</main>
