<section class="recover-pass-container" role="main" aria-labelledby="recover-pass-title">
  <app-button
    [label]="'RECOVER_PASSWORD.HOME' | translate"
    variant="primary"
    (click)="goHome()"
    [attr.aria-label]="'RECOVER_PASSWORD.ACCESSIBILITY.HOME_BTN' | translate"
  ></app-button>
  
  <header>
    <h2 class="recover-pass-title">
      {{ 'RECOVER_PASSWORD.TITLE' | translate }}
    </h2>

    <p class="recover-pass-text">
      {{ 'RECOVER_PASSWORD.DESCRIPTION' | translate }}
    </p>
  </header>

  <form
    [formGroup]="recoverForm"
    (ngSubmit)="onSubmit()"
    class="recover-pass-form"
    [attr.aria-label]="'RECOVER_PASSWORD.TITLE' | translate"
  >
    <div>
      <app-inputs
        type="password"
        name="password"
        [label]="'RECOVER_PASSWORD.LABEL_NEW_PASS' | translate"
        [control]="getCtrl('password')"
        [errorMessage]="getErrorMessage('password')"
        [attr.aria-invalid]="getCtrl('password').invalid && getCtrl('password').touched"
      ></app-inputs>
    </div>

    <app-button
      type="submit"
      variant="primary"
      [label]="'RECOVER_PASSWORD.BTN_SUBMIT' | translate"
      [attr.aria-label]="'RECOVER_PASSWORD.ACCESSIBILITY.SUBMIT_BTN' | translate"
    ></app-button>
  </form>
</section>
