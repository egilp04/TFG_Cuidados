<div class="recover-pass-container">
  <app-button
    [label]="'RECOVER_PASSWORD.HOME' | translate"
    variant="primary"
    (onClick)="goHome()"
  ></app-button>
  <div>
    <h2 class="recover-pass-title">
      {{ 'RECOVER_PASSWORD.TITLE' | translate }}
    </h2>
    @if (this.messageService.messageData(); as data) {
      <div
        [ngClass]="{
          'text-red-500': data.tipo === 'error',
          'text-primary': data.tipo === 'exito',
        }"
        class="text-label recover-pass-message"
      >
        {{ data.mensaje }}
      </div>
    }

    <p class="recover-pass-text">
      {{ 'RECOVER_PASSWORD.DESCRIPTION' | translate }}
    </p>
  </div>

  <form [formGroup]="recoverForm" (ngSubmit)="onSubmit()" class="recover-pass-form">
    <div>
      <app-inputs
        type="password"
        name="password"
        [label]="'RECOVER_PASSWORD.LABEL_NEW_PASS' | translate"
        [control]="getCtrl('password')"
        [errorMessage]="getErrorMessage('password')"
      ></app-inputs>
    </div>

    <app-button
      type="submit"
      variant="primary"
      [label]="'RECOVER_PASSWORD.BTN_SUBMIT' | translate"
    ></app-button>
  </form>
</div>
