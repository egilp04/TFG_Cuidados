<header
  class="button-back-container"
  [attr.aria-label]="'ACTIVITIES.ACCESSIBILITY.BACK_NAV' | translate"
>
  <app-buttonback></app-buttonback>
</header>

@if (this.messageService.messageData(); as data) {
  <section class="message-noti" role="status" aria-live="polite">
    <div
      [ngClass]="{
        'text-red-500': data.tipo === 'error',
        'text-primary': data.tipo === 'exito',
      }"
      class="message-noti-text"
    >
      <span class="sr-only">
        {{ (data.tipo === 'error' ? 'COMMON.ERROR' : 'COMMON.SUCCESS') | translate }}:
      </span>
      {{ data.mensaje }}
    </div>
  </section>
}
<section
  class="activities-page-container"
  role="main"
  [attr.aria-labelledby]="'activities-main-title'"
>
  <h1 id="activities-main-title" class="activities-page-title">
    {{ 'ACTIVITIES.TITLE' | translate }}
  </h1>

  <main class="mb-20">
    <app-activities-components
      [dataSource]="dataSource.data"
      (onCancelContract)="cancelContract($event)"
    ></app-activities-components>
  </main>
</section>
