<header
  class="button-back-container"
  [attr.aria-label]="'ADMIN_MANAGEMENT.ACCESSIBILITY.BACK_NAV' | translate"
>
  <app-buttonback></app-buttonback>
</header>

<section
  class="mangment-admin-container"
  role="main"
  [attr.aria-label]="
    (isClient
      ? 'ADMIN_MANAGEMENT.ACCESSIBILITY.CLIENT_SECTION'
      : 'ADMIN_MANAGEMENT.ACCESSIBILITY.BUSINESS_SECTION'
    ) | translate
  "
>
  <div class="mangment-admin-btn-container">
    <app-button
      [label]="
        (isClient ? 'ADMIN_MANAGEMENT.NEW_CLIENT' : 'ADMIN_MANAGEMENT.NEW_BUSINESS') | translate
      "
      variant="primary"
      (click)="createUser()"
      [attr.aria-label]="
        (isClient
          ? 'ADMIN_MANAGEMENT.ACCESSIBILITY.NEW_CLIENT_BTN'
          : 'ADMIN_MANAGEMENT.ACCESSIBILITY.NEW_BUSINESS_BTN'
        ) | translate
      "
    >
    </app-button>
  </div>

  <app-table-crud-admin
    [mode]="isClient ? 'client' : 'business'"
    [data]="userService.usersList()"
    (deleteData)="deleteUser($event)"
    (modifyData)="editUser($event)"
  ></app-table-crud-admin>
</section>
