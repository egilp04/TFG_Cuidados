<header
  class="button-back-container"
  [attr.aria-label]="'ADMIN_MANAGEMENT.ACCESSIBILITY.BACK_NAV' | translate"
>
  <app-buttonback></app-buttonback>
</header>

<section
  class="mangment-admin-container"
  role="main"
  [attr.aria-label]="
    (isUser
      ? 'ADMIN_MANAGEMENT.ACCESSIBILITY.CLIENT_SECTION'
      : 'ADMIN_MANAGEMENT.ACCESSIBILITY.COMPANY_SECTION'
    ) | translate
  "
>
  <div class="mangment-admin-btn-container">
    <app-button
      [label]="
        (isUser ? 'ADMIN_MANAGEMENT.NEW_CLIENT' : 'ADMIN_MANAGEMENT.NEW_COMPANY') | translate
      "
      variant="primary"
      (click)="createNewUser()"
      [attr.aria-label]="
        (isUser
          ? 'ADMIN_MANAGEMENT.ACCESSIBILITY.NEW_CLIENT_BTN'
          : 'ADMIN_MANAGEMENT.ACCESSIBILITY.NEW_COMPANY_BTN'
        ) | translate
      "
    >
    </app-button>
  </div>

  <app-table-crud-admin
    [mode]="isUser ? 'cliente' : 'empresa'"
    [data]="userService.usersList()"
    (deleteData)="toDeleteUser($event)"
    (modifyData)="toEditFunction($event)"
  ></app-table-crud-admin>
</section>
