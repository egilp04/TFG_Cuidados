<section class="button-back-container">
  <app-buttonback></app-buttonback>
</section>
@if (this.messageService.messageData(); as data) {
  <section class="message-noti">
    <div
      [ngClass]="{
        'text-red-500': data.tipo === 'error',
        'text-primary': data.tipo === 'exito',
      }"
      class="message-noti-text"
    >
      {{ data.mensaje }}
    </div>
  </section>
}

<section class="mangment-admin-container">
  <div class="mangment-admin-btn-container">
    <app-button
      [label]="
        (isUser ? 'ADMIN_MANAGEMENT.NEW_CLIENT' : 'ADMIN_MANAGEMENT.NEW_COMPANY') | translate
      "
      variant="primary"
      (click)="createNewUser()"
    >
    </app-button>
  </div>
  <app-table-crud-admin
    [modo]="isUser ? 'cliente' : 'empresa'"
    [data]="(usuarios$ | async) || []"
    (eliminar)="onEliminarUsuario($event)"
    (modificar)="toEditFunction($event)"
  ></app-table-crud-admin>
</section>
