<div class="main-container" (scroll)="onContainerScroll($event)">
  
  @if (!router.url.includes('recover-password')) {
    <app-navbar class="flex-none"></app-navbar>
    @if (this.authService.isAuthenticated()) {
      <app-nav-home></app-nav-home>
    }
  }
  <main>
    <router-outlet></router-outlet>
  </main>
  @if (!router.url.includes('recover-password')) {
    <app-footer></app-footer>
  }
  @defer (on idle) {
    <app-ai-assistant></app-ai-assistant>
  } @placeholder {
    <div aria-hidden="true"></div>
  }
</div>

@if (showScrollBtn) {
  <button 
    (click)="scrollToTop()"
    class="fixed bottom-8 right-8 z-[2000] 
           flex h-12 w-12 items-center justify-center rounded-full 
           bg-accent text-white shadow-lg outline-none
           transition-all duration-300 hover:bg-green-600 
           hover:scale-110 active:scale-95
           animate-in fade-in slide-in-from-bottom-4"
    aria-label="Subir al inicio"
  >
    <svg 
      xmlns="http://www.w3.org/2000/svg" 
      class="h-6 w-6" 
      fill="none" 
      viewBox="0 0 24 24" 
      stroke="currentColor" 
      stroke-width="2.5"
    >
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 15l7-7 7 7" />
    </svg>
  </button>
}


<app-global-notifications></app-global-notifications>
